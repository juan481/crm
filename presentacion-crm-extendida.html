<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JustCRM · by JustCreate — Presentación completa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

  :root{
    --accent1:#6366f1; --accent2:#8b5cf6;
    --dark-bg:#0f172a; --dark-surface:#1a2233;
    --bg:#f1f5f9; --surface:#ffffff; --surface-raised:#f8fafc;
    --text:#1e293b; --text-muted:#64748b; --text-subtle:#94a3b8;
    --border:rgba(0,0,0,0.08);
    --good:#10b981; --warn:#f59e0b; --danger:#ef4444; --info:#3b82f6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--dark-bg);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #deck{position:relative; width:100vw; height:100vh; overflow:hidden;}
  .slide{
    position:absolute; inset:0;
    display:none;
    background:var(--bg);
    overflow-y:auto;
  }
  .slide.active{display:flex; flex-direction:column;}
  .slide.dark{background:var(--dark-bg); color:#f1f5f9;}
  .slide-inner{
    max-width:1100px; width:100%; margin:0 auto;
    padding:64px 56px 100px 56px;
    flex:1;
  }
  @media (max-width:780px){ .slide-inner{padding:32px 22px 100px 22px;} }

  .kicker{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent1); margin-bottom:14px;
  }
  .dark .kicker{color:#a5b4fc;}
  .kicker .dot{width:6px; height:6px; border-radius:50%; background:linear-gradient(135deg,var(--accent1),var(--accent2));}

  h1.slide-title{font-size:38px; font-weight:700; line-height:1.15; margin-bottom:10px; color:var(--text);}
  .dark h1.slide-title{color:#fff;}
  .slide-subtitle{font-size:16px; color:var(--text-muted); margin-bottom:30px; max-width:760px; line-height:1.6;}
  .dark .slide-subtitle{color:#94a3b8;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media (max-width:900px){ .grid2,.grid3{grid-template-columns:1fr;} }

  .bullets{list-style:none; display:flex; flex-direction:column; gap:12px;}
  .bullets li{display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.55; color:var(--text);}
  .dark .bullets li{color:#e2e8f0;}
  .bullets li .dotmark{
    width:7px; height:7px; border-radius:50%; margin-top:7px; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
  }
  .bullets b{color:var(--text); font-weight:600;}
  .dark .bullets b{color:#fff;}

  .icon-badge{
    width:44px; height:44px; border-radius:13px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#fff; box-shadow:0 6px 16px -4px rgba(99,102,241,.5);
  }
  .icon-badge svg{width:22px; height:22px;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; display:flex; flex-direction:column; gap:10px;
  }
  .dark .card{background:var(--dark-surface); border-color:rgba(255,255,255,.08);}
  .card-title{font-weight:600; font-size:14.5px; color:var(--text); display:flex; align-items:center; gap:9px;}
  .dark .card-title{color:#fff;}
  .card-body{font-size:13.5px; color:var(--text-muted); line-height:1.55;}
  .dark .card-body{color:#94a3b8;}

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:999px;
    white-space:nowrap;
  }
  .pill.neutral{background:#f1f5f9; color:#475569;}
  .pill.accent{background:rgba(99,102,241,.12); color:#6366f1;}
  .pill.good{background:rgba(16,185,129,.12); color:#059669;}
  .pill.warn{background:rgba(245,158,11,.12); color:#b45309;}
  .pill.danger{background:rgba(239,68,68,.12); color:#dc2626;}
  .pill.info{background:rgba(59,130,246,.12); color:#2563eb;}
  .dark .pill.neutral{background:rgba(255,255,255,.08); color:#cbd5e1;}

  /* Mock browser frame */
  .mock{
    border-radius:16px; overflow:hidden; border:1px solid var(--border);
    background:var(--surface); box-shadow:0 20px 45px -20px rgba(15,23,42,.25);
  }
  .dark .mock{border-color:rgba(255,255,255,.1);}
  .mock-bar{
    height:34px; background:var(--surface-raised); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:6px; padding:0 14px;
  }
  .dark .mock-bar{background:#141b2e; border-color:rgba(255,255,255,.08);}
  .mock-bar .dotc{width:9px; height:9px; border-radius:50%;}
  .mock-bar-title{margin-left:10px; font-size:11px; color:var(--text-subtle); font-weight:500;}
  .mock-body{padding:18px;}

  .mock-row{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
    font-size:12.5px; color:var(--text);
  }
  .dark .mock-row{color:#e2e8f0;}
  .mock-row:nth-child(odd){background:var(--surface-raised);}
  .dark .mock-row:nth-child(odd){background:rgba(255,255,255,.03);}

  .kanban{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  .kanban-col{background:var(--surface-raised); border-radius:11px; padding:9px; min-height:150px;}
  .dark .kanban-col{background:rgba(255,255,255,.03);}
  .kanban-col-h{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; color:var(--text-muted);}
  .kanban-card{
    background:var(--surface); border:1px solid var(--border); border-radius:9px;
    padding:9px; font-size:11.5px; margin-bottom:7px; box-shadow:0 3px 8px -4px rgba(0,0,0,.1);
  }
  .dark .kanban-card{background:var(--dark-surface); border-color:rgba(255,255,255,.08);}

  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;}
  .dark .stat-tile{background:var(--dark-surface); border-color:rgba(255,255,255,.08);}
  .stat-tile .num{font-size:26px; font-weight:700; color:var(--text);}
  .dark .stat-tile .num{color:#fff;}
  .stat-tile .lbl{font-size:12px; color:var(--text-muted); margin-top:2px;}

  .callout{
    border-radius:14px; padding:16px 18px; font-size:13.5px; line-height:1.6;
    display:flex; gap:12px; align-items:flex-start;
  }
  .callout.roadmap{background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); color:#92400e;}
  .dark .callout.roadmap{color:#fcd34d;}
  .callout.fixed{background:rgba(16,185,129,.08); border:1px solid rgba(16,185,129,.25); color:#065f46;}
  .dark .callout.fixed{color:#6ee7b7;}
  .callout.info{background:rgba(99,102,241,.08); border:1px solid rgba(99,102,241,.25); color:#3730a3;}
  .dark .callout.info{color:#c7d2fe;}

  .phone-frame{
    width:230px; border-radius:32px; border:8px solid #1e293b; background:#1e293b;
    box-shadow:0 25px 50px -18px rgba(0,0,0,.4); overflow:hidden; flex-shrink:0;
  }
  .phone-screen{background:var(--surface); min-height:400px; border-radius:24px; overflow:hidden;}
  .phone-notch{height:20px; background:#1e293b; display:flex; align-items:center; justify-content:center;}
  .phone-notch::after{content:''; width:60px; height:6px; background:#0f172a; border-radius:4px;}

  /* Divider slide */
  .divider-slide{
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; height:100%; padding:40px;
  }
  .divider-num{
    font-size:15px; font-weight:700; color:#a5b4fc; letter-spacing:.2em; margin-bottom:18px;
  }
  .divider-title{font-size:52px; font-weight:700; color:#fff; line-height:1.1; max-width:820px;}
  .divider-sub{font-size:16px; color:#94a3b8; margin-top:16px; max-width:560px;}

  /* Cover slide */
  .cover{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:40px;}
  .cover-mark{
    width:74px; height:74px; margin-bottom:28px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    box-shadow:0 20px 45px -12px rgba(99,102,241,.6);
  }
  .cover h1{font-size:58px; font-weight:800; color:#fff; line-height:1.08; max-width:900px;}
  .cover .grad{background:linear-gradient(135deg,#818cf8,#c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .cover p.tag{color:#94a3b8; font-size:17px; margin-top:20px; max-width:640px; line-height:1.6;}
  .cover .brandline{margin-top:44px; color:#64748b; font-size:13px; letter-spacing:.05em;}

  /* Nav chrome */
  #chrome{position:fixed; inset:0; pointer-events:none; z-index:50;}
  #progress-track{position:fixed; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.08); z-index:60;}
  #progress-bar{height:100%; background:linear-gradient(90deg,var(--accent1),var(--accent2)); width:0%; transition:width .2s ease;}
  #counter{
    position:fixed; top:16px; right:20px; font-size:12px; color:#94a3b8;
    background:rgba(15,23,42,.55); backdrop-filter:blur(6px); padding:6px 12px; border-radius:999px;
    pointer-events:auto; z-index:60; font-weight:500;
  }
  #closebtn{
    position:fixed; top:14px; left:20px; width:32px; height:32px; border-radius:10px;
    background:rgba(15,23,42,.55); backdrop-filter:blur(6px); color:#cbd5e1; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; z-index:60;
    font-size:16px;
  }
  #closebtn:hover{background:rgba(15,23,42,.85);}
  .navbtn{
    position:fixed; bottom:24px; width:44px; height:44px; border-radius:50%;
    background:rgba(15,23,42,.6); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.1);
    color:#e2e8f0; display:flex; align-items:center; justify-content:center; cursor:pointer;
    pointer-events:auto; z-index:60; font-size:18px; transition:all .15s;
  }
  .navbtn:hover{background:rgba(99,102,241,.7); transform:scale(1.06);}
  .navbtn:disabled{opacity:.25; cursor:default; pointer-events:none;}
  #prevbtn{left:calc(50% - 60px);}
  #nextbtn{left:calc(50% + 16px);}
  #tocbtn{
    position:fixed; bottom:24px; right:20px; height:36px; padding:0 14px; border-radius:999px;
    background:rgba(15,23,42,.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.1);
    color:#cbd5e1; display:flex; align-items:center; gap:6px; cursor:pointer; pointer-events:auto; z-index:60;
    font-size:12px; font-weight:500; font-family:inherit;
  }
  #tocbtn:hover{background:rgba(15,23,42,.85);}

  /* Table of contents overlay */
  #toc-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.92); backdrop-filter:blur(8px);
    z-index:100; display:none; overflow-y:auto; padding:60px 24px;
  }
  #toc-overlay.open{display:block;}
  .toc-wrap{max-width:760px; margin:0 auto;}
  .toc-wrap h2{color:#fff; font-size:26px; margin-bottom:24px;}
  .toc-list{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  @media (max-width:700px){.toc-list{grid-template-columns:1fr;}}
  .toc-item{
    display:flex; gap:10px; align-items:baseline; padding:9px 12px; border-radius:9px;
    color:#cbd5e1; cursor:pointer; font-size:13.5px; transition:background .1s;
  }
  .toc-item:hover{background:rgba(255,255,255,.06);}
  .toc-item .n{color:#64748b; font-variant-numeric:tabular-nums; width:22px; flex-shrink:0;}
  .toc-item.section{color:#a5b4fc; font-weight:600; margin-top:10px;}

  code, .mono{font-family:'SF Mono',Consolas,monospace;}

  @keyframes slideIn{ from{opacity:0; transform:translateX(14px);} to{opacity:1; transform:translateX(0);} }
  .slide.active .slide-inner{animation:slideIn .28s ease-out;}
  @media (prefers-reduced-motion:reduce){ .slide.active .slide-inner{animation:none;} }
</style>
</head>
<body>

<div id="progress-track"><div id="progress-bar"></div></div>
<button id="closebtn" title="Cerrar (Esc)" onclick="if(confirm('¿Cerrar la presentación?'))window.close();">✕</button>
<div id="counter"></div>
<button id="prevbtn" class="navbtn" onclick="go(-1)">‹</button>
<button id="nextbtn" class="navbtn" onclick="go(1)">›</button>
<button id="tocbtn" onclick="toggleToc()">☰ Índice</button>

<div id="toc-overlay">
  <div class="toc-wrap">
    <h2>Índice</h2>
    <div class="toc-list" id="toc-list"></div>
  </div>
</div>

<div id="deck"></div>

<script>
/* ============================= ICONOS (SVG inline, sin dependencias) ============================= */
const ICONS = {
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14a5 5 0 0 1 5.5 5"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>',
  building:'<rect x="5" y="3" width="14" height="18" rx="1.4"/><path d="M9 8h1M9 12h1M9 16h1M14 8h1M14 12h1M14 16h1"/>',
  dollar:'<path d="M12 2v20"/><path d="M17 6.5c0-2-2.2-3.2-5-3.2-3 0-5 1.4-5 3.5 0 4.4 10 2.3 10 6.8 0 2.1-2.2 3.6-5 3.6-2.8 0-5-1.2-5-3.4"/>',
  phone:'<rect x="6" y="2.5" width="12" height="19" rx="2.2"/><path d="M10 19h4"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  alert:'<path d="M12 3.5L2 20h20L12 3.5z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r="0.4" fill="currentColor"/>',
  shield:'<path d="M12 3l7 3v6c0 4.6-3 8.2-7 9-4-.8-7-4.4-7-9V6l7-3z"/><path d="M9 12l2 2 4-4.5"/>',
  smartphone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  folder:'<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2.5h9A1.5 1.5 0 0 1 21 9v9.5A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-12z"/>',
  tag:'<path d="M3 11.5l9-9h6.5V9l-9 9L3 11.5z"/><circle cx="15" cy="7" r="1.3"/>',
  send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
  star:'<path d="M12 2.5l3 6.3 6.8.9-5 4.9 1.2 6.9L12 17.8l-6 3.7 1.2-6.9-5-4.9 6.8-.9L12 2.5z"/>',
  settings:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.3M12 18.7V21M21 12h-2.3M5.3 12H3M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/>',
  chat:'<path d="M4 5h16v11H8l-4 4V5z"/>',
  file:'<path d="M6 2.5h8l4.5 4.5V21H6V2.5z"/><path d="M14 2.5V7h4.5"/>',
  creditcard:'<rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19"/>',
  trending:'<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7h-4v4"/>',
  headphones:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  clipboard:'<rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="3.5" rx="1"/><path d="M8.5 11h7M8.5 15h7"/>',
  zap:'<path d="M12 2L4 14h6l-1 8 9-13h-6l1-7z"/>',
  download:'<path d="M12 3v12M7 11l5 5 5-5"/><path d="M4 20h16"/>',
  key:'<circle cx="8" cy="15" r="4.2"/><path d="M11 12l9-9M17 6l2.5 2.5M14 9l2 2"/>',
  bell:'<path d="M6 10a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10.5 20a1.7 1.7 0 0 0 3 0"/>',
  wifi:'<path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5.5 12.5a11 11 0 0 1 13 0"/><path d="M9 16.5a5.5 5.5 0 0 1 6 0"/><circle cx="12" cy="20" r="0.6" fill="currentColor"/>',
  checksquare:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l2.5 2.5L16 9"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  robot:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1.2"/><circle cx="9" cy="13" r="1.2" fill="currentColor"/><circle cx="15" cy="13" r="1.2" fill="currentColor"/><path d="M9 17h6"/>',
  store:'<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v10.5h16V9"/><path d="M9.5 19.5V14h5v5.5"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  pin:'<path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/>',
  branch:'<circle cx="6" cy="4.5" r="2"/><circle cx="6" cy="19.5" r="2"/><circle cx="18" cy="9.5" r="2"/><path d="M6 6.5v11M6 9.5c0 3 3 3 6 3h4"/>',
  puzzle:'<path d="M7 4h4v2.2a1.8 1.8 0 0 0 3.5 0V4H19v4.5h-2.2a1.8 1.8 0 0 0 0 3.5H19V16h-4.5v-2.2a1.8 1.8 0 0 0-3.5 0V16H7v-4.5H4.8a1.8 1.8 0 0 1 0-3.5H7V4z"/>',
};
function icon(name, size){
  size = size || 22;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.check}</svg>`;
}
function badge(name, size){ return `<div class="icon-badge">${icon(name, size||22)}</div>`; }

/* ============================= HELPERS DE CONTENIDO ============================= */
function K(text){ return `<div class="kicker"><span class="dot"></span>${text}</div>`; }
function B(items){
  return `<ul class="bullets">${items.map(t=>`<li><span class="dotmark"></span><span>${t}</span></li>`).join('')}</ul>`;
}
function pill(text, tone){ return `<span class="pill ${tone||'neutral'}">${text}</span>`; }
function card(iconName, title, body){
  return `<div class="card"><div class="card-title">${icon(iconName,17)} ${title}</div><div class="card-body">${body}</div></div>`;
}
function stat(num, lbl){ return `<div class="stat-tile"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`; }
function callout(kind, iconName, text){
  return `<div class="callout ${kind}">${icon(iconName,17)}<div>${text}</div></div>`;
}
function mockBar(title, dots){
  dots = dots===false ? '' : `<span class="dotc" style="background:#ef4444"></span><span class="dotc" style="background:#f59e0b"></span><span class="dotc" style="background:#10b981"></span>`;
  return `<div class="mock-bar">${dots}<span class="mock-bar-title">${title}</span></div>`;
}
function mock(title, bodyHtml, opts){
  opts = opts || {};
  return `<div class="mock" style="${opts.style||''}">${mockBar(title)}<div class="mock-body">${bodyHtml}</div></div>`;
}
function mockRow(left, right, rightTone){
  return `<div class="mock-row"><span style="flex:1">${left}</span><span>${pill(right, rightTone||'neutral')}</span></div>`;
}

function SLIDE(id, kicker, title, subtitle, bodyHtml, opts){
  opts = opts || {};
  return {id, dark:false, html:`
    <div class="slide-inner">
      ${K(kicker)}
      <h1 class="slide-title">${title}</h1>
      ${subtitle ? `<p class="slide-subtitle">${subtitle}</p>` : ''}
      ${bodyHtml}
    </div>`};
}
function DIVIDER(id, num, title, sub){
  return {id, dark:true, html:`
    <div class="divider-slide">
      <div class="divider-num">${num}</div>
      <div class="divider-title">${title}</div>
      ${sub ? `<div class="divider-sub">${sub}</div>`:''}
    </div>`};
}
function COVER(){
  return {id:'cover', dark:true, toc:'Portada', html:`
    <div class="cover">
      <div class="cover-mark"></div>
      <h1>JustCRM <span class="grad">by JustCreate</span></h1>
      <p class="tag">Todo lo que hoy vive en WhatsApp, planillas de Excel y la memoria de cada uno, en un solo lugar — con un usuario y un rol para cada persona del equipo.</p>
      <p class="brandline">Presentación completa del sistema · usá las flechas o la barra espaciadora para avanzar</p>
    </div>`};
}

/* ============================= MOTOR DE LA PRESENTACIÓN ============================= */
let current = 0;
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const tocList = document.getElementById('toc-list');

function render(){
  deck.innerHTML = SLIDES.map((s,i)=>`<div class="slide ${s.dark?'dark':''}" data-i="${i}">${s.html}</div>`).join('');
}
function show(i){
  if(i<0) i=0;
  if(i>=SLIDES.length) i=SLIDES.length-1;
  current = i;
  document.querySelectorAll('.slide').forEach((el)=>el.classList.remove('active'));
  const el = deck.querySelector(`.slide[data-i="${i}"]`);
  if(el){ el.classList.add('active'); el.scrollTop = 0; }
  counter.textContent = `${i+1} / ${SLIDES.length}`;
  document.getElementById('progress-bar').style.width = `${((i+1)/SLIDES.length)*100}%`;
  document.getElementById('prevbtn').disabled = i===0;
  document.getElementById('nextbtn').disabled = i===SLIDES.length-1;
  document.querySelectorAll('.toc-item').forEach(t=>t.style.background = (+t.dataset.i===i) ? 'rgba(99,102,241,.18)' : '');
}
function go(delta){ show(current+delta); }
function toggleToc(){
  const ov = document.getElementById('toc-overlay');
  ov.classList.toggle('open');
}
function buildToc(){
  let lastSection = null;
  tocList.innerHTML = SLIDES.map((s,i)=>{
    const label = s.toc || (s.html.match(/slide-title">([^<]+)</)?.[1]) || (s.html.match(/divider-title">([^<]+)</)?.[1]) || s.id;
    return `<div class="toc-item" data-i="${i}" onclick="show(${i}); toggleToc();"><span class="n">${i+1}</span><span>${label}</span></div>`;
  }).join('');
}

document.addEventListener('keydown', (e)=>{
  if(document.getElementById('toc-overlay').classList.contains('open')){
    if(e.key==='Escape') toggleToc();
    return;
  }
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
});
document.getElementById('toc-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='toc-overlay') toggleToc();
});

render();
buildToc();
show(0);
</script>
